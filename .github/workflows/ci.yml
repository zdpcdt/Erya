# 尔雅 CI：
#   push/PR  —— 只跑测试：Linux / macOS / Windows 三平台全量（Core + UI 渲染测试，全部可无头运行）
#   手动打包 —— 打包不在 push 时自动触发，一律在 Actions 页 Run workflow 手动点：
#               按需勾选便携（非 AOT）/ AOT 变体；release_tag 留空 = 只构建，产物从 run 页下载；
#               填版本号（如 v0.1.0）= 构建完成后自动建 tag + GitHub Release，挂全部产物
#               （3 平台 × AOT/非 AOT 六个 zip + Linux 三件套 tar.gz/AppImage/deb）
#
# 打包矩阵与 packaging/publish.ps1 对齐：Native AOT 不可交叉编译，
# 每个 RID 都在其原生系统的 runner 上构建（windows-latest=win-x64、ubuntu-latest=linux-x64、macos-latest=osx-arm64）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_portable:
        description: 构建自包含（非 AOT）包
        type: boolean
        default: true
      build_aot:
        description: 构建 Native AOT 包
        type: boolean
        default: true
      release_tag:
        description: 发布标签（如 v0.1.0；留空=只构建不发布）
        type: string
        default: ''

concurrency:
  # 分组带事件名：手动打包一跑半小时，不被 push 触发的测试挤进队列排队
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test tests/Erya.Core.Tests -c Release
      - name: UI render tests
        run: dotnet test tests/Erya.UiTests -c Release

  package-portable:
    name: package (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.build_portable != false
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, label: win-x64 }
          - { rid: linux-x64, os: ubuntu-latest, label: linux-x64 }
          - { rid: osx-arm64, os: macos-latest, label: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: publish + zip
        shell: pwsh
        run: ./packaging/publish.ps1 -Rid ${{ matrix.rid }}
      # Linux 桌面用户另有三件套（tar.gz/AppImage/deb），与 zip 同源 publish
      - name: Linux bundles (tar.gz / AppImage / deb)
        if: matrix.rid == 'linux-x64'
        run: bash packaging/linux/dist.sh linux-x64
      - name: upload zip
        uses: actions/upload-artifact@v4
        with:
          name: erya-${{ matrix.label }}
          path: dist/Erya_*.zip
          if-no-files-found: error
      - name: upload Linux bundles
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: erya-linux-bundles
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  package-aot:
    name: package (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.build_aot != false
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, label: win-x64-aot }
          - { rid: linux-x64, os: ubuntu-latest, label: linux-x64-aot }
          - { rid: osx-arm64, os: macos-latest, label: osx-arm64-aot }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Native AOT 需要 clang + zlib 头；runner 镜像自带 clang，zlib1g-dev 补一下保险
      - name: AOT toolchain (clang + zlib)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: publish + zip
        shell: pwsh
        run: ./packaging/publish.ps1 -Rid ${{ matrix.rid }} -Aot
      - name: upload zip
        uses: actions/upload-artifact@v4
        with:
          name: erya-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [package-portable, package-aot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 不存在时由 action 以当前 commit SHA 创建
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/Erya_*.zip
            dist/erya-*.tar.gz
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
