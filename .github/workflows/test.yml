# 尔雅测试：push 到 main / PR 时跑 Linux、macOS、Windows 三平台全量测试。
# Core 单元测试 + UI 渲染测试（全部可无头运行，README 截图即由测试对着真实发行版生成）。
# 打包在 package / release 两个工作流里，均为手动触发，与本文件无关。

name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test tests/Erya.Core.Tests -c Release
      - name: UI render tests
        run: dotnet test tests/Erya.UiTests -c Release
